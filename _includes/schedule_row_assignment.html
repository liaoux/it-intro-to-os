<div class="col col-1" style="color: #31708f ;font-weight: bold;" data-label="Event">TP</div>
<div class="col col-1-2" data-label="Date">
    Publié le<br />
    {{ include.event.date | date: "%d %b %Y" }}
</div>

<div class="col col-2" style="font-weight: bold" data-label="Description">
    [<a href="{{ include.event.url | prepend: site.baseurl}}">{{ include.event.title }}</a>]
</div>
<div class="col col-4" data-label="Support">
    {{ include.event.objectif }}
    {% if include.event.solutions %}
    [<a href="{{ include.event.solutions | prepend: site.baseurl}}">Corrigé</a>]
    {% endif %}
</div>
